[package]
name = "loompa-forge"
version = "0.1.0"
edition = "2024"
description = "Queue and run coding-agent tasks defined as Markdown files"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.0"
humantime = "2.4.0"
humantime-serde = "1.1.1"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "lf"
path = "src/main.rs"
